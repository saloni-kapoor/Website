<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | OXL</title>
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="contact-page">

    <div class="contact-page-title">

        <div class="small-title">
            CONTACT US
        </div>

        <h1>
            Let's Start A
            <br>
            Conversation
        </h1>

        <p>
            Have a story to tell, a film to create, or an idea
            that deserves to be heard? Get in touch with us.
        </p>

    </div>


    <div class="contact-container">

        <div class="contact-form">

            <h2>
                Send Us A Message
            </h2>

            <p class="form-description">
                Tell us about your project and we'll get back
                to you as soon as possible.
            </p>


            <form>

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your Name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Your Email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Your Phone Number"
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <select id="subject" name="subject">

                        <option value="">
                            Select Subject
                        </option>

                        <option value="film-production">
                            Film Production
                        </option>

                        <option value="ott-content">
                            OTT Content
                        </option>

                        <option value="brand-content">
                            Brand Content
                        </option>

                        <option value="collaboration">
                            Collaboration
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Tell us about your project..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="contact-submit"
                >
                    Send Message
                </button>

            </form>

        </div>

    </div>

</main>
    <footer class="contact-footer">

        <p>
            © 2026 OXL Films & Content House.
            All Rights Reserved.
        </p>

    </footer>


</body>

</html>
